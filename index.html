<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Poster</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{margin:0;font-family:Poppins;background:#eee}
.app{max-width:1000px;margin:auto;padding:10px}
.poster{width:350px;height:550px;margin:auto;background:#111;color:#fff;position:relative;overflow:hidden}
.bg{position:absolute;width:100%;height:100%}
.el{position:absolute;cursor:move}
.title{top:50px;width:100%;text-align:center;font-size:26px;font-weight:900}
.photo{top:150px;left:100px;width:120px;height:120px;border-radius:50%;overflow:hidden;background:#ccc}
.photo img{width:100%;height:100%;object-fit:cover}
.name{top:280px;width:100%;text-align:center;font-size:18px}
.info{top:320px;width:90%;left:5%;background:#fff;color:#000;padding:10px;border-radius:10px;font-size:12px}
.host{bottom:0;width:100%;background:#000;text-align:center;padding:8px}
</style>
</head>

<body>

<div class="app">

<input id="titleText" value="RCM Poster">
<input id="nameText" value="Name">
<input id="dateText" value="Date">
<input id="venueText" value="Venue">
<input id="mapLink" placeholder="Map Link">

<input type="file" id="photoInput">

<select id="themeSelect"></select>

<button onclick="updatePoster()">Update</button>
<button onclick="randomTheme()">Random</button>
<button onclick="generateQR()">QR</button>
<button onclick="download()">Download</button>

<div class="poster" id="poster">
<div class="bg" id="bg"></div>

<div class="el title" id="pTitle"></div>
<div class="el photo" id="pPhoto">Photo</div>
<div class="el name" id="pName"></div>
<div class="el info" id="pInfo"></div>
<div class="el host" id="pHost"></div>
<div class="el" id="qrBox" style="right:10px;bottom:80px;"></div>

</div>

</div>

<script>

window.onload=function(){

const themeSelect=document.getElementById("themeSelect");
const bg=document.getElementById("bg");

const themes=[];
const colors=[["#ff9933","#fff","#138808"],["#000","#3b82f6","#fff"]];

for(let i=0;i<200;i++){
 let c=colors[i%colors.length];
 let a=(i*20)%360;
 themes.push(`linear-gradient(${a}deg,${c[0]},${c[1]},${c[2]})`);
}

themes.forEach((t,i)=>{
 let o=document.createElement("option");
 o.value=i;
 o.textContent="Design "+(i+1);
 themeSelect.appendChild(o);
});

window.updatePoster=function(){
 document.getElementById("pTitle").innerText=titleText.value;
 document.getElementById("pName").innerText=nameText.value;
 document.getElementById("pInfo").innerHTML=`📅 ${dateText.value}<br>📍 ${venueText.value}`;
 document.getElementById("pHost").innerText="RCM Team";
 bg.style.background=themes[themeSelect.value];
}

window.randomTheme=function(){
 themeSelect.value=Math.floor(Math.random()*themes.length);
 updatePoster();
}

document.getElementById("photoInput").onchange=function(e){
 let f=e.target.files[0];
 let r=new FileReader();
 r.onload=()=>{
  document.getElementById("pPhoto").innerHTML=`<img src="${r.result}">`;
 }
 r.readAsDataURL(f);
}

window.generateQR=function(){
 let box=document.getElementById("qrBox");
 box.innerHTML="";
 new QRCode(box,{
  text:document.getElementById("mapLink").value || "RCM",
  width:80,
  height:80
 });
}

window.download=function(){
 html2canvas(document.getElementById("poster")).then(canvas=>{
  let a=document.createElement("a");
  a.href=canvas.toDataURL();
  a.download="poster.png";
  a.click();
 });
}

updatePoster();

}

</script>

</body>
</html>
