<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RCM ULTRA PRO V3</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{margin:0;font-family:Poppins;background:#f1f5f9}
.app{max-width:1200px;margin:auto;padding:10px}
.grid{display:grid;grid-template-columns:350px 1fr;gap:10px}

input,textarea,select,button{
width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #ccc
}
button{background:#000080;color:#fff;font-weight:900;border:0}

.poster{
width:360px;height:600px;margin:auto;
background:#111;color:#fff;position:relative;
overflow:hidden;box-shadow:0 10px 30px #0006
}

.bg{position:absolute;width:100%;height:100%;z-index:0}
.el{position:absolute;cursor:move;z-index:2}
.resize{resize:both;overflow:auto}

.title{top:40px;width:100%;text-align:center;font-size:28px;font-weight:900}
.sub{top:90px;width:90%;left:5%;text-align:center}
.photo{top:150px;left:100px;width:150px;height:150px;border-radius:50%;background:#ccc;overflow:hidden}
.name{top:320px;width:100%;text-align:center;font-weight:900}
.info{bottom:120px;width:90%;left:5%;background:#fff;color:#000;padding:10px;border-radius:10px}
.host{bottom:0;width:100%;background:#000;padding:8px;text-align:center}
.qr{bottom:60px;right:10px}

</style>
</head>

<body>

<div class="app">
<div class="grid">

<!-- LEFT PANEL -->
<div>

<input id="titleText" value="RCM नये भारत का निर्माण">
<textarea id="subText">Smart Income Opportunity</textarea>
<input id="nameText" value="Leader Name">
<input id="dateText" value="26 April">
<input id="timeText" value="9:30 AM">
<textarea id="venueText">Parbhani</textarea>
<input id="mapLink" placeholder="Google Map Link">

<input type="file" id="photoInput">
<input type="file" id="bgUpload">

<select id="templateSelect"></select>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
<button onclick="applyTemplate()">Template</button>
<button onclick="aiPoster()">AI Design</button>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
<button onclick="qr()">QR</button>
<button onclick="download()">Download</button>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
<button onclick="saveLocal()">Save</button>
<button onclick="loadLocal()">Load</button>
</div>

<button onclick="addText()">+ Add Text</button>

</div>

<!-- POSTER -->
<div>
<div class="poster" id="poster">

<div class="bg" id="bg"></div>

<div class="el title resize" id="pTitle"></div>
<div class="el sub resize" id="pSub"></div>
<div class="el photo resize" id="pPhoto">Photo</div>
<div class="el name resize" id="pName"></div>
<div class="el info resize" id="pInfo"></div>
<div class="el host resize" id="pHost"></div>
<div class="el qr resize" id="qrBox"></div>

</div>
</div>

</div>
</div>

<script>

// 50 Templates
const templates=[
"linear-gradient(135deg,#ff9933,#fff,#138808)",
"linear-gradient(135deg,#000,#1e3a8a)",
"linear-gradient(135deg,#ff0000,#000)",
"linear-gradient(135deg,#16a34a,#dcfce7)",
"linear-gradient(135deg,#7c3aed,#f0abfc)",
"linear-gradient(135deg,#0ea5e9,#bae6fd)"
];

for(let i=0;i<50;i++){
let t=templates[i%templates.length];
let o=document.createElement("option");
o.value=t;o.textContent="Template "+(i+1);
templateSelect.appendChild(o);
}

// UPDATE
function update(){
pTitle.innerText=titleText.value;
pSub.innerText=subText.value;
pName.innerText=nameText.value;

pInfo.innerHTML=
"📅 "+dateText.value+"<br>"+
"⏰ "+timeText.value+"<br>"+
"📍 "+venueText.value;

pHost.innerText="RCM TEAM";
}

// TEMPLATE
function applyTemplate(){
bg.style.background=templateSelect.value;
update();
}

// AI DESIGN
function aiPoster(){
let random=templates[Math.floor(Math.random()*templates.length)];
bg.style.background=random;

pTitle.style.fontSize=Math.random()*10+25+"px";
pSub.style.fontSize=Math.random()*8+14+"px";

update();
}

// PHOTO
photoInput.onchange=e=>{
let r=new FileReader();
r.onload=()=>pPhoto.innerHTML=`<img src="${r.result}" style="width:100%;height:100%">`;
r.readAsDataURL(e.target.files[0]);
}

// BG IMAGE
bgUpload.onchange=e=>{
let r=new FileReader();
r.onload=()=>bg.style.background=`url(${r.result}) center/cover`;
r.readAsDataURL(e.target.files[0]);
}

// QR
function qr(){
qrBox.innerHTML="";
new QRCode(qrBox,{
text:mapLink.value||"RCM",
width:80,height:80
});
}

// DOWNLOAD
function download(){
html2canvas(poster,{scale:4}).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="poster.png";
a.click();
});
}

// SAVE
function saveLocal(){
let data={
title:titleText.value,
sub:subText.value,
name:nameText.value
};
localStorage.setItem("posterV3",JSON.stringify(data));
alert("Saved");
}

// LOAD
function loadLocal(){
let d=JSON.parse(localStorage.getItem("posterV3")||"{}");
titleText.value=d.title||"";
subText.value=d.sub||"";
nameText.value=d.name||"";
update();
}

// ADD TEXT BOX
function addText(){
let d=document.createElement("div");
d.className="el resize";
d.innerText="New Text";
d.style.top="200px";
d.style.left="50px";
poster.appendChild(d);
drag(d);
}

// DRAG
function drag(el){
let x,y,drag=false;
el.onmousedown=e=>{
drag=true;x=e.offsetX;y=e.offsetY;
};
document.onmousemove=e=>{
if(drag){
el.style.left=(e.pageX-x)+"px";
el.style.top=(e.pageY-y)+"px";
}
};
document.onmouseup=()=>drag=false;
}
document.querySelectorAll(".el").forEach(drag);

update();

</script>

</body>
</html>
