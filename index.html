<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Canva Poster Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins,Arial;
  background:linear-gradient(135deg,#ff9933,#fff,#138808);
  padding:12px;
}
.app{
  max-width:1150px;
  margin:auto;
  background:#fff;
  border-radius:20px;
  padding:14px;
  box-shadow:0 12px 30px #0003;
}
h2{text-align:center;color:#000080;margin:0 0 10px}
.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:15px;
}
input,textarea,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-family:inherit;
}
button{
  width:100%;
  padding:12px;
  margin-top:7px;
  border:0;
  border-radius:12px;
  background:#000080;
  color:white;
  font-weight:900;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.poster{
  width:720px;
  height:1080px;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#111;
  color:white;
  box-shadow:0 15px 40px #0005;
  transform-origin:top center;
}
.bg{
  position:absolute;
  inset:0;
}
.el{
  position:absolute;
  cursor:move;
  user-select:none;
}
.title{
  font-family:"Baloo 2";
  font-size:70px;
  font-weight:900;
  line-height:1.05;
  text-shadow:0 4px 12px #0008;
  width:600px;
  left:60px;
  top:90px;
  text-align:center;
}
.sub{
  font-size:34px;
  font-weight:800;
  width:600px;
  left:60px;
  top:250px;
  text-align:center;
}
.photo{
  width:300px;
  height:300px;
  left:210px;
  top:385px;
  border-radius:50%;
  border:12px solid white;
  background:#eee;
  overflow:hidden;
  display:grid;
  place-items:center;
  color:#444;
  font-weight:900;
}
.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.name{
  font-size:46px;
  font-weight:900;
  width:620px;
  left:50px;
  top:705px;
  text-align:center;
  text-shadow:0 4px 12px #0008;
}
.info{
  background:white;
  color:#111;
  border-radius:28px;
  padding:24px;
  font-size:30px;
  font-weight:900;
  line-height:1.5;
  width:620px;
  left:50px;
  top:790px;
}
.host{
  bottom:0;
  left:0;
  width:720px;
  background:#0009;
  padding:22px;
  font-size:28px;
  font-weight:900;
  text-align:center;
}
.badge{
  top:35px;
  left:50px;
  background:#ffcc00;
  color:#111;
  padding:10px 28px;
  border-radius:999px;
  font-weight:900;
  font-size:26px;
}
.logo{
  top:30px;
  right:40px;
  font-size:26px;
  font-weight:900;
}
.shape{
  position:absolute;
  border-radius:50%;
  background:#ffffff25;
}
#s1{width:420px;height:420px;right:-120px;top:-100px}
#s2{width:300px;height:300px;left:-90px;bottom:140px}
.small{font-size:12px;color:#666;text-align:center}
.green{background:#138808}
.red{background:#d32f2f}
.orange{background:#ff9933;color:#111}
.dark{background:#111827}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .poster{width:360px;height:540px}
  .title{font-size:35px;width:300px;left:30px;top:45px}
  .sub{font-size:17px;width:300px;left:30px;top:125px}
  .photo{width:150px;height:150px;left:105px;top:192px;border-width:6px}
  .name{font-size:23px;width:310px;left:25px;top:352px}
  .info{font-size:15px;width:310px;left:25px;top:395px;padding:12px;border-radius:14px}
  .host{width:360px;font-size:14px;padding:11px}
  .badge{font-size:13px;top:18px;left:25px;padding:5px 14px}
  .logo{font-size:13px;top:15px;right:20px}
}
</style>
</head>

<body>

<div class="app">
<h2>🚀 Ultra Canva Poster Editor</h2>

<div class="grid">

<div>
<input id="badgeText" value="RCM BUSINESS SEMINAR">
<input id="titleText" value="RCM नये भारत का निर्माण">
<textarea id="subText">स्मार्ट बचत, आरोग्य आणि उत्पन्नाची सुवर्णसंधी</textarea>
<input id="nameText" value="दिनेश राजपूत सर">

<div class="row">
<input id="dateText" value="26 एप्रिल 2026">
<input id="timeText" value="सकाळी 9:30 वा.">
</div>

<textarea id="venueText">कृष्णाई RCM सेवा केंद्र, स्नेह शारदा नगर, वसमत रोड, परभणी</textarea>

<div class="row">
<input id="hostText" value="DS WORLD TEAM">
<input id="mobileText" value="9876543210">
</div>

<input type="file" id="photoInput" accept="image/*">

<select id="themeSelect" onchange="applyTheme()">
<option value="0">RCM Tricolor</option>
<option value="1">Business Blue</option>
<option value="2">Premium Gold</option>
<option value="3">Health Green</option>
<option value="4">Social Viral</option>
<option value="5">Royal Purple</option>
</select>

<div class="row">
<button onclick="updatePoster()">Update</button>
<button class="orange" onclick="randomTheme()">Random</button>
</div>

<div class="row">
<button class="green" onclick="saveLocal()">Save</button>
<button class="dark" onclick="loadLocal()">Load</button>
</div>

<button class="red" onclick="downloadPoster()">Download HD PNG</button>

<p class="small">Tip: Poster वरील text/photo finger ने drag करून हलवता येईल.</p>
</div>

<div>
<div class="poster" id="poster">
  <div class="bg" id="bg"></div>
  <div class="shape" id="s1"></div>
  <div class="shape" id="s2"></div>

  <div class="el badge" id="badge"></div>
  <div class="el logo" id="logo">DS WORLD</div>
  <div class="el title" id="pTitle"></div>
  <div class="el sub" id="pSub"></div>
  <div class="el photo" id="pPhoto">Photo</div>
  <div class="el name" id="pName"></div>
  <div class="el info" id="pInfo"></div>
  <div class="el host" id="pHost"></div>
</div>
</div>

</div>
</div>

<script>
const themes=[
  "linear-gradient(135deg,#ff9933,#fff,#138808)",
  "linear-gradient(135deg,#061b4e,#1d4ed8,#38bdf8)",
  "radial-gradient(circle at top,#fef3c7,#92400e,#09090b)",
  "linear-gradient(135deg,#064e3b,#16a34a,#dcfce7)",
  "linear-gradient(145deg,#f97316 0 34%,#fff 34% 55%,#138808 55%)",
  "linear-gradient(135deg,#2e1065,#7e22ce,#f0abfc)"
];

function updatePoster(){
  badge.innerText=badgeText.value;
  pTitle.innerText=titleText.value;
  pSub.innerText=subText.value;
  pName.innerText=nameText.value;
  pInfo.innerHTML=`📅 ${dateText.value}<br>⏰ ${timeText.value}<br>📍 ${venueText.value}`;
  pHost.innerText=`${hostText.value} | ${mobileText.value}`;
  applyTheme();
}

function applyTheme(){
  let i=themeSelect.value;
  bg.style.background=themes[i];

  if(i==2){
    badge.style.background="#111827";
    badge.style.color="#fbbf24";
    pTitle.style.color="#fff8dc";
    pName.style.color="#fbbf24";
  }else if(i==3){
    badge.style.background="#dcfce7";
    badge.style.color="#064e3b";
    pTitle.style.color="white";
    pName.style.color="#dcfce7";
  }else if(i==4){
    badge.style.background="#000080";
    badge.style.color="white";
    pTitle.style.color="#000080";
    pTitle.style.textShadow="none";
    pName.style.color="#000080";
    pName.style.textShadow="none";
  }else{
    badge.style.background="#ffcc00";
    badge.style.color="#111";
    pTitle.style.color="white";
    pTitle.style.textShadow="0 4px 12px #0008";
    pName.style.color="white";
    pName.style.textShadow="0 4px 12px #0008";
  }
}

function randomTheme(){
  themeSelect.value=Math.floor(Math.random()*themes.length);
  applyTheme();

  const layouts=[
    {photo:[210,385],title:[60,90],info:[50,790]},
    {photo:[380,340],title:[45,120],info:[50,760]},
    {photo:[60,360],title:[300,110],info:[50,780]},
    {photo:[210,300],title:[60,620],info:[50,790]}
  ];

  let l=layouts[Math.floor(Math.random()*layouts.length)];
  setPos(pPhoto,l.photo[0],l.photo[1]);
  setPos(pTitle,l.title[0],l.title[1]);
  setPos(pInfo,l.info[0],l.info[1]);

  pPhoto.style.borderRadius=Math.random()>0.5?"50%":"35px";
}

function setPos(el,x,y){
  el.style.left=x+"px";
  el.style.top=y+"px";
}

photoInput.onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    pPhoto.innerHTML=`<img src="${r.result}">`;
    localStorage.setItem("posterPhoto",r.result);
  };
  r.readAsDataURL(f);
};

function makeDraggable(el){
  let ox=0,oy=0,drag=false;

  el.addEventListener("mousedown",start);
  el.addEventListener("touchstart",start,{passive:false});

  function start(e){
    drag=true;
    const p=e.touches?e.touches[0]:e;
    ox=p.clientX-el.offsetLeft;
    oy=p.clientY-el.offsetTop;
    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",end);
    document.addEventListener("touchmove",move,{passive:false});
    document.addEventListener("touchend",end);
  }

  function move(e){
    if(!drag)return;
    e.preventDefault();
    const p=e.touches?e.touches[0]:e;
    el.style.left=(p.clientX-ox)+"px";
    el.style.top=(p.clientY-oy)+"px";
  }

  function end(){
    drag=false;
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",end);
  }
}

document.querySelectorAll(".el").forEach(makeDraggable);

function saveLocal(){
  updatePoster();
  const data={
    badge:badgeText.value,title:titleText.value,sub:subText.value,name:nameText.value,
    date:dateText.value,time:timeText.value,venue:venueText.value,
    host:hostText.value,mobile:mobileText.value,theme:themeSelect.value
  };
  localStorage.setItem("posterData",JSON.stringify(data));
  alert("Saved");
}

function loadLocal(){
  const d=JSON.parse(localStorage.getItem("posterData")||"{}");
  if(d.title){
    badgeText.value=d.badge;
    titleText.value=d.title;
    subText.value=d.sub;
    nameText.value=d.name;
    dateText.value=d.date;
    timeText.value=d.time;
    venueText.value=d.venue;
    hostText.value=d.host;
    mobileText.value=d.mobile;
    themeSelect.value=d.theme;
  }
  const img=localStorage.getItem("posterPhoto");
  if(img)pPhoto.innerHTML=`<img src="${img}">`;
  updatePoster();
}

async function downloadPoster(){
  updatePoster();
  await document.fonts.ready;
  html2canvas(poster,{scale:4,useCORS:true,allowTaint:true}).then(canvas=>{
    const a=document.createElement("a");
    a.href=canvas.toDataURL("image/png",1.0);
    a.download="Ultra-Pro-Poster.png";
    a.click();
  });
}

updatePoster();
loadLocal();
</script>

</body>
</html>
